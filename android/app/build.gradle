plugins { id 'com.android.application' }

android { namespace 'com.brainrotheist'; compileSdk 36
    defaultConfig { applicationId 'com.brainrotheist'; minSdk 23; targetSdk 36; versionCode 1; versionName '1.0.1' }
    buildTypes { release { minifyEnabled false } }
}

tasks.register('syncWebAssets', Sync) {
    from(rootProject.projectDir.parent) { include 'index.html'; include 'style.css'; include 'manifest.json'; include 'sw.js'; include 'js/**' }
    into(layout.projectDirectory.dir('src/main/assets'))
}
tasks.named('preBuild').configure { dependsOn(tasks.named('syncWebAssets')) }
